services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appp
      POSTGRES_USER: appp
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appp -d appp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    environment: &app-env
      DATABASE_URL: postgres://appp:${PG_PASS}@postgres:5432/appp
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL_NLU: ${ANTHROPIC_MODEL_NLU:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_PLANNING: ${ANTHROPIC_MODEL_PLANNING:-claude-sonnet-4-6}
      ANTHROPIC_DAILY_TOKEN_LIMIT: ${ANTHROPIC_DAILY_TOKEN_LIMIT:-100000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      TZ: America/Santiago
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    restart: unless-stopped

  worker:
    build: ./app
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
