<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APPP — Tareas</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223a;
      --border:  #2d2d4e;
      --accent:  #4f46e5;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.875rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .subtitle { font-size: 0.8rem; color: var(--muted); margin-left: auto; }

    /* ── Filters ── */
    .filters {
      padding: 0.875rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .filter-group { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }
    .filter-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 0.25rem; white-space: nowrap; }

    .pill {
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .date-inputs { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .date-inputs input[type="date"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .date-inputs input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.5); }
    .date-sep { color: var(--muted); font-size: 0.8rem; }

    .btn-refresh {
      margin-left: auto;
      padding: 0.35rem 0.9rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .btn-refresh:hover { background: var(--border); }

    /* ── Summary strip ── */
    .summary {
      display: flex;
      gap: 0.75rem;
      padding: 0.625rem 1.25rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .summary::-webkit-scrollbar { display: none; }
    .badge {
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-total       { background: rgba(148,163,184,.15); color: var(--muted); }
    .badge-PENDING     { background: rgba(99,102,241,.18);  color: #818cf8; }
    .badge-IN_PROGRESS { background: rgba(245,158,11,.18);  color: #fbbf24; }
    .badge-BLOCKED     { background: rgba(239,68,68,.18);   color: #f87171; }
    .badge-DEFERRED    { background: rgba(167,139,250,.18); color: #c4b5fd; }
    .badge-DONE        { background: rgba(16,185,129,.18);  color: #34d399; }
    .badge-CANCELLED   { background: rgba(148,163,184,.12); color: #64748b; }

    /* ── Main content ── */
    .main { padding: 1rem 1.25rem; }

    /* ── Empty / Error / Loading ── */
    .state-msg {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .state-msg .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; border-radius: 0.75rem; border: 1px solid var(--border); }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    thead { background: var(--surface2); }
    th {
      padding: 0.625rem 0.875rem;
      text-align: left;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.625rem 0.875rem;
      border-bottom: 1px solid rgba(45,45,78,.5);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.025); }

    .col-title { max-width: 260px; }
    .title-wrap { display: flex; flex-direction: column; gap: 0.15rem; }
    .title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; display: block; }
    .notes-preview { font-size: 0.72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }

    /* Status badge inline */
    .status {
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      white-space: nowrap;
      display: inline-block;
    }

    /* Priority */
    .priority { font-weight: 700; font-size: 0.8rem; }
    .p1 { color: #f87171; }
    .p2 { color: #fb923c; }
    .p3 { color: #fbbf24; }
    .p4 { color: #a3e635; }
    .p5 { color: var(--muted); }

    /* Progress bar */
    .progress-wrap { width: 80px; }
    .progress-bar {
      height: 5px;
      border-radius: 99px;
      background: var(--border);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      transition: width .4s;
    }
    .progress-pct { font-size: 0.7rem; color: var(--muted); text-align: right; margin-top: 2px; }

    .date-cell { white-space: nowrap; font-size: 0.78rem; color: var(--muted); }
    .date-cell.overdue { color: #f87171; }

    /* Action button */
    .btn-action {
      padding: 0.25rem 0.6rem;
      border-radius: 0.4rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn-action:hover { background: var(--accent); border-color: var(--accent); }

    /* ── Cards (mobile) ── */
    @media (max-width: 640px) {
      .table-wrap { display: none; }
      .cards { display: flex; flex-direction: column; gap: 0.625rem; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 0.875rem 1rem;
      }
      .card-header { display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
      .card-title { font-weight: 600; font-size: 0.9rem; flex: 1; line-height: 1.4; }
      .card-notes { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; line-height: 1.4; }
      .card-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; font-size: 0.75rem; color: var(--muted); }
      .card-footer { margin-top: 0.625rem; display: flex; justify-content: flex-end; }
    }
    @media (min-width: 641px) {
      .cards { display: none; }
    }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .modal-title {
      flex: 1;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.4;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.1rem;
    }
    .modal-close:hover { color: var(--text); }

    .modal-section {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }
    .modal-section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      padding-bottom: 0.375rem;
      border-bottom: 1px solid var(--border);
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .btn-transition {
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      border: 1px solid transparent;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-transition:hover { opacity: .85; }
    .btn-transition:active { transform: scale(.97); }
    .btn-transition.selected { outline: 2px solid #fff; outline-offset: 2px; }

    .no-transitions {
      font-size: 0.82rem;
      color: var(--muted);
      font-style: italic;
    }

    .modal label {
      font-size: 0.8rem;
      color: var(--muted);
      display: block;
      margin-bottom: 0.25rem;
    }
    .modal textarea, .modal input[type="date"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      padding: 0.5rem 0.65rem;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
    }
    .modal textarea:focus, .modal input[type="date"]:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }
    .modal input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.5); }

    .defer-row { display: none; flex-direction: column; gap: 0.25rem; }
    .defer-row.visible { display: flex; }

    .modal-actions { display: flex; flex-direction: column; gap: 0.5rem; }

    .btn-primary {
      padding: 0.55rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 0.5rem;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      width: 100%;
    }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { opacity: .88; }

    .btn-secondary {
      padding: 0.55rem 1rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      width: 100%;
    }
    .btn-secondary:hover { background: var(--border); }

    .modal-msg {
      font-size: 0.8rem;
      padding: 0.4rem 0.65rem;
      border-radius: 0.4rem;
      display: none;
    }
    .modal-msg.ok    { background: rgba(16,185,129,.15); color: #34d399; display: block; }
    .modal-msg.error { background: rgba(239,68,68,.15);  color: #f87171; display: block; }

    .divider { border: none; border-top: 1px solid var(--border); }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">📋</span>
  <h1>Tareas</h1>
  <span class="subtitle" id="last-update"></span>
</header>

<div class="filters">
  <div class="filter-group">
    <span class="filter-label">Estado</span>
    <button class="pill active" data-status="PENDING">Pendiente</button>
    <button class="pill active" data-status="IN_PROGRESS">En curso</button>
    <button class="pill active" data-status="BLOCKED">Bloqueada</button>
    <button class="pill" data-status="DEFERRED">Diferida</button>
    <button class="pill" data-status="DONE">Hecha</button>
    <button class="pill" data-status="CANCELLED">Cancelada</button>
  </div>
  <div class="filter-group">
    <span class="filter-label">Fecha</span>
    <div class="date-inputs">
      <input type="date" id="date-from" title="Desde">
      <span class="date-sep">→</span>
      <input type="date" id="date-to"   title="Hasta">
    </div>
  </div>
  <button class="btn-refresh" id="btn-refresh">↻ Actualizar</button>
</div>

<div class="summary" id="summary"></div>

<div class="main">
  <div class="state-msg" id="state-msg">
    <div class="icon">⏳</div>
    Cargando tareas…
  </div>

  <!-- Table (desktop) -->
  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>Título</th>
          <th>Estado</th>
          <th>Prioridad</th>
          <th>Programada</th>
          <th>Vence</th>
          <th>Progreso</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Cards (mobile) -->
  <div class="cards" id="cards"></div>
</div>

<!-- ── Modal de acciones ── -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-task-title">

    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-task-title">—</div>
        <div style="margin-top:.25rem" id="modal-current-status"></div>
      </div>
      <button class="modal-close" id="modal-close" aria-label="Cerrar">✕</button>
    </div>

    <!-- Estado -->
    <div class="modal-section" id="section-status">
      <div class="modal-section-title">Cambiar estado</div>
      <div class="action-buttons" id="action-buttons"></div>
      <div class="defer-row" id="defer-row">
        <label for="defer-date">Nueva fecha programada</label>
        <input type="date" id="defer-date">
      </div>
      <div>
        <label for="change-note">Nota del cambio (opcional)</label>
        <textarea id="change-note" rows="2" placeholder="Motivo del cambio de estado…"></textarea>
      </div>
      <div id="modal-msg-status" class="modal-msg"></div>
      <button class="btn-primary" id="btn-apply-status" disabled>Aplicar cambio</button>
    </div>

    <hr class="divider">

    <!-- Observaciones -->
    <div class="modal-section">
      <div class="modal-section-title">Observaciones</div>
      <textarea id="notes-textarea" rows="4" placeholder="Notas libres sobre esta tarea…"></textarea>
      <div id="modal-msg-notes" class="modal-msg"></div>
      <button class="btn-secondary" id="btn-save-notes">Guardar observaciones</button>
    </div>

  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const TOKEN  = params.get('token') ?? '';

  /* ── FSM transitions (mirror of task-status.fsm.ts) ── */
  const TRANSITIONS = {
    PENDING:     ['IN_PROGRESS', 'DEFERRED', 'BLOCKED', 'CANCELLED'],
    IN_PROGRESS: ['DONE', 'BLOCKED', 'DEFERRED', 'CANCELLED'],
    BLOCKED:     ['IN_PROGRESS', 'CANCELLED'],
    DEFERRED:    ['PENDING', 'CANCELLED'],
    DONE:        [],
    CANCELLED:   [],
  };

  const ACTION_META = {
    IN_PROGRESS: { label: 'Iniciar',   bg: 'rgba(245,158,11,.25)',  color: '#fbbf24', border: '#b45309' },
    DONE:        { label: 'Completar', bg: 'rgba(16,185,129,.25)',  color: '#34d399', border: '#065f46' },
    CANCELLED:   { label: 'Cancelar',  bg: 'rgba(239,68,68,.2)',    color: '#f87171', border: '#991b1b' },
    DEFERRED:    { label: 'Posponer',  bg: 'rgba(167,139,250,.2)',  color: '#c4b5fd', border: '#6d28d9' },
    BLOCKED:     { label: 'Bloquear',  bg: 'rgba(239,68,68,.15)',   color: '#fca5a5', border: '#7f1d1d' },
    PENDING:     { label: 'Retomar',   bg: 'rgba(99,102,241,.2)',   color: '#818cf8', border: '#3730a3' },
  };

  /* ── Status metadata ── */
  const STATUS_META = {
    PENDING:     { label: 'Pendiente',  cls: 'badge-PENDING',     style: 'background:rgba(99,102,241,.2);color:#818cf8' },
    IN_PROGRESS: { label: 'En curso',   cls: 'badge-IN_PROGRESS', style: 'background:rgba(245,158,11,.2);color:#fbbf24' },
    BLOCKED:     { label: 'Bloqueada',  cls: 'badge-BLOCKED',     style: 'background:rgba(239,68,68,.2);color:#f87171' },
    DEFERRED:    { label: 'Diferida',   cls: 'badge-DEFERRED',    style: 'background:rgba(167,139,250,.2);color:#c4b5fd' },
    DONE:        { label: 'Hecha',      cls: 'badge-DONE',        style: 'background:rgba(16,185,129,.2);color:#34d399' },
    CANCELLED:   { label: 'Cancelada',  cls: 'badge-CANCELLED',   style: 'background:rgba(148,163,184,.1);color:#64748b' },
  };

  /* ── State ── */
  let tasks = [];
  let loading = false;
  let activeTask = null;
  let selectedTarget = null;

  /* ── DOM refs ── */
  const summaryEl   = document.getElementById('summary');
  const stateEl     = document.getElementById('state-msg');
  const tableWrap   = document.getElementById('table-wrap');
  const tbody       = document.getElementById('tbody');
  const cardsEl     = document.getElementById('cards');
  const lastUpdate  = document.getElementById('last-update');
  const dateFrom    = document.getElementById('date-from');
  const dateTo      = document.getElementById('date-to');
  const backdrop    = document.getElementById('modal-backdrop');
  const modalTitle  = document.getElementById('modal-task-title');
  const modalStatus = document.getElementById('modal-current-status');
  const actionBtns  = document.getElementById('action-buttons');
  const deferRow    = document.getElementById('defer-row');
  const deferDate   = document.getElementById('defer-date');
  const changeNote  = document.getElementById('change-note');
  const notesTA     = document.getElementById('notes-textarea');
  const btnApply    = document.getElementById('btn-apply-status');
  const btnNotes    = document.getElementById('btn-save-notes');
  const msgStatus   = document.getElementById('modal-msg-status');
  const msgNotes    = document.getElementById('modal-msg-notes');

  /* ── Pills ── */
  const pills = [...document.querySelectorAll('.pill[data-status]')];
  pills.forEach(p => p.addEventListener('click', () => { p.classList.toggle('active'); load(); }));

  function activeStatuses() {
    return pills.filter(p => p.classList.contains('active')).map(p => p.dataset.status);
  }

  dateFrom.addEventListener('change', load);
  dateTo.addEventListener('change', load);
  document.getElementById('btn-refresh').addEventListener('click', load);

  /* ── Helpers ── */
  function fmt(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return d.toLocaleDateString('es-CL', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }

  function isOverdue(dateStr) {
    if (!dateStr) return false;
    return new Date(dateStr) < new Date();
  }

  function statusBadge(s) {
    const m = STATUS_META[s] ?? { label: s, style: '' };
    return `<span class="status" style="${m.style}">${m.label}</span>`;
  }

  function priorityHtml(p) {
    const cls = p <= 1 ? 'p1' : p === 2 ? 'p2' : p === 3 ? 'p3' : p === 4 ? 'p4' : 'p5';
    return `<span class="priority ${cls}">P${p}</span>`;
  }

  function progressHtml(pct) {
    const v = pct ?? 0;
    return `<div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${v}%"></div></div>
      <div class="progress-pct">${v}%</div>
    </div>`;
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Render ── */
  function renderSummary() {
    const counts = {};
    for (const t of tasks) counts[t.status] = (counts[t.status] ?? 0) + 1;
    const parts = [`<span class="badge badge-total">${tasks.length} tareas</span>`];
    for (const [s, m] of Object.entries(STATUS_META)) {
      if (counts[s]) parts.push(`<span class="badge ${m.cls}">${m.label}: ${counts[s]}</span>`);
    }
    summaryEl.innerHTML = parts.join('');
  }

  function renderTable() {
    if (!tasks.length) {
      stateEl.innerHTML = '<div class="icon">🎉</div>No hay tareas con los filtros actuales.';
      stateEl.style.display = 'block';
      tableWrap.style.display = 'none';
      cardsEl.innerHTML = '';
      return;
    }
    stateEl.style.display = 'none';

    tbody.innerHTML = tasks.map(t => {
      const dueCls = isOverdue(t.dueAt) && t.status !== 'DONE' && t.status !== 'CANCELLED' ? 'overdue' : '';
      const notesPreview = t.notes ? `<span class="notes-preview" title="${esc(t.notes)}">${esc(t.notes)}</span>` : '';
      return `<tr>
        <td class="col-title">
          <div class="title-wrap">
            <span class="title-text" title="${esc(t.title)}">${esc(t.title)}</span>
            ${notesPreview}
          </div>
        </td>
        <td>${statusBadge(t.status)}</td>
        <td>${priorityHtml(t.priority)}</td>
        <td class="date-cell">${fmt(t.scheduledFor)}</td>
        <td class="date-cell ${dueCls}">${fmt(t.dueAt)}</td>
        <td>${progressHtml(t.progressPct)}</td>
        <td><button class="btn-action" data-id="${t.taskId}">Acciones</button></td>
      </tr>`;
    }).join('');
    tableWrap.style.display = 'block';

    cardsEl.innerHTML = tasks.map(t => {
      const dueCls = isOverdue(t.dueAt) && t.status !== 'DONE' && t.status !== 'CANCELLED' ? 'overdue' : '';
      return `<div class="card">
        <div class="card-header">
          <div class="card-title">${esc(t.title)}</div>
          ${statusBadge(t.status)}
        </div>
        ${t.notes ? `<div class="card-notes">${esc(t.notes)}</div>` : ''}
        <div class="card-meta">
          ${priorityHtml(t.priority)}
          ${t.scheduledFor ? `<span>📅 ${fmt(t.scheduledFor)}</span>` : ''}
          ${t.dueAt ? `<span class="${dueCls}">⏰ ${fmt(t.dueAt)}</span>` : ''}
          ${t.progressPct != null ? `<span>▶ ${t.progressPct}%</span>` : ''}
        </div>
        <div class="card-footer">
          <button class="btn-action" data-id="${t.taskId}">Acciones</button>
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.btn-action[data-id]').forEach(btn => {
      btn.addEventListener('click', () => openModal(btn.dataset.id));
    });
  }

  /* ── Load ── */
  async function load() {
    if (loading) return;
    if (!TOKEN) {
      stateEl.innerHTML = '<div class="icon">🔒</div>Sin token de acceso. Escribe <strong>/tareas</strong> en Telegram.';
      return;
    }

    loading = true;
    stateEl.innerHTML = '<div class="icon">⏳</div>Cargando…';
    stateEl.style.display = 'block';
    tableWrap.style.display = 'none';
    cardsEl.innerHTML = '';

    const statuses = activeStatuses();
    const qs = new URLSearchParams({ token: TOKEN });
    if (statuses.length) qs.set('status', statuses.join(','));
    if (dateFrom.value) qs.set('from', dateFrom.value);
    if (dateTo.value)   qs.set('to',   dateTo.value);

    try {
      const res = await fetch(`/tasks-api/list?${qs}`);
      if (res.status === 401) {
        stateEl.innerHTML = '<div class="icon">🔒</div>Sesión expirada. Escribe <strong>/tareas</strong> en Telegram para obtener un nuevo enlace.';
        loading = false;
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      tasks = await res.json();
      renderSummary();
      renderTable();
      lastUpdate.textContent = `Actualizado ${new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' })}`;
    } catch (err) {
      stateEl.innerHTML = `<div class="icon">❌</div>Error al cargar: ${err.message}`;
    }
    loading = false;
  }

  /* ── Modal ── */
  function openModal(taskId) {
    activeTask = tasks.find(t => t.taskId === taskId);
    if (!activeTask) return;

    selectedTarget = null;
    modalTitle.textContent = activeTask.title;
    modalStatus.innerHTML = statusBadge(activeTask.status);

    // Build transition buttons
    const transitions = TRANSITIONS[activeTask.status] ?? [];
    if (transitions.length === 0) {
      actionBtns.innerHTML = `<span class="no-transitions">Este estado no permite más cambios.</span>`;
      btnApply.disabled = true;
    } else {
      actionBtns.innerHTML = transitions.map(t => {
        const m = ACTION_META[t] ?? { label: t, bg: 'var(--surface2)', color: 'var(--text)', border: 'var(--border)' };
        return `<button class="btn-transition" data-target="${t}"
          style="background:${m.bg};color:${m.color};border-color:${m.border}">${m.label}</button>`;
      }).join('');
      actionBtns.querySelectorAll('.btn-transition').forEach(btn => {
        btn.addEventListener('click', () => selectTransition(btn));
      });
      btnApply.disabled = true;
    }

    deferRow.classList.remove('visible');
    deferDate.value = '';
    changeNote.value = '';
    notesTA.value = activeTask.notes ?? '';
    clearMsg(msgStatus);
    clearMsg(msgNotes);

    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function selectTransition(btn) {
    actionBtns.querySelectorAll('.btn-transition').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTarget = btn.dataset.target;
    btnApply.disabled = false;

    if (selectedTarget === 'DEFERRED') {
      deferRow.classList.add('visible');
    } else {
      deferRow.classList.remove('visible');
      deferDate.value = '';
    }
  }

  function closeModal() {
    backdrop.classList.remove('open');
    document.body.style.overflow = '';
    activeTask = null;
    selectedTarget = null;
  }

  function showMsg(el, type, text) {
    el.className = `modal-msg ${type}`;
    el.textContent = text;
  }
  function clearMsg(el) {
    el.className = 'modal-msg';
    el.textContent = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  btnApply.addEventListener('click', async () => {
    if (!activeTask || !selectedTarget) return;
    if (selectedTarget === 'DEFERRED' && !deferDate.value) {
      showMsg(msgStatus, 'error', 'Selecciona la nueva fecha para posponer.');
      return;
    }

    btnApply.disabled = true;
    clearMsg(msgStatus);
    try {
      const body = { token: TOKEN, toStatus: selectedTarget };
      if (changeNote.value.trim()) body.note = changeNote.value.trim();
      if (selectedTarget === 'DEFERRED') body.deferTo = deferDate.value;

      const res = await fetch(`/tasks-api/${activeTask.taskId}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message ?? `HTTP ${res.status}`);

      showMsg(msgStatus, 'ok', 'Estado actualizado correctamente.');
      // update local state
      const t = tasks.find(x => x.taskId === activeTask.taskId);
      if (t) { t.status = selectedTarget; modalStatus.innerHTML = statusBadge(selectedTarget); }
      activeTask.status = selectedTarget;
      selectedTarget = null;
      actionBtns.querySelectorAll('.btn-transition').forEach(b => b.classList.remove('selected'));
      btnApply.disabled = true;
      deferRow.classList.remove('visible');

      // Rebuild buttons for new status
      setTimeout(() => openModal(activeTask.taskId), 600);
      load();
    } catch (err) {
      showMsg(msgStatus, 'error', err.message);
      btnApply.disabled = false;
    }
  });

  btnNotes.addEventListener('click', async () => {
    if (!activeTask) return;
    btnNotes.disabled = true;
    clearMsg(msgNotes);
    try {
      const res = await fetch(`/tasks-api/${activeTask.taskId}/notes`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: TOKEN, notes: notesTA.value || null }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message ?? `HTTP ${res.status}`);
      showMsg(msgNotes, 'ok', 'Observaciones guardadas.');
      const t = tasks.find(x => x.taskId === activeTask.taskId);
      if (t) t.notes = notesTA.value || null;
      activeTask.notes = notesTA.value || null;
      renderTable();
    } catch (err) {
      showMsg(msgNotes, 'error', err.message);
    }
    btnNotes.disabled = false;
  });

  // Auto-refresh cada 60 s
  setInterval(load, 60_000);
  load();
</script>
</body>
</html>
